# Global tool versions for the jvm stack (image <distro>-jvm, e.g. fedora-jvm).
# Override per-project with a .mise.toml in the project root.

[tools]
# Temurin 25 is the current Java LTS (Sep 2025 → Sep 2030 community
# support). mise's core `java` backend resolves "temurin-25" to the
# latest 25.x patch via the Adoptium API. Per-project overrides via
# `.mise.toml` in the project repo (e.g., `java = "temurin-17"` for
# repos still on JDK 17).
java = "temurin-25"

# Maven release cadence is steady; `latest` is fine for the global
# default. Projects that need a specific Maven version pin it via
# project-local `.mise.toml`.
maven = "latest"

# Gradle is the default build tool for most modern Kotlin and Android
# templates and is common in Java projects too. Like Maven, projects
# usually ship a wrapper (`./gradlew`) that pins the exact Gradle
# version per repo — this global install is the convenience tool for
# bootstrapping wrappers and ad-hoc use.
gradle = "latest"

# `sbt` here is the launcher script; the real sbt build + Scala compiler
# are downloaded on first invocation in a project, driven by that
# project's `project/build.properties`. `latest` keeps just the launcher
# current.
sbt = "latest"

# Modern Scala CLI — self-bootstraps the compiler version per project.
# Forced to the asdf backend because mise's default `github:` backend
# extracts the upstream single-binary `.gz` without renaming, so the
# executable on PATH ends up as `scala-cli-aarch64-pc-linux` rather
# than `scala-cli`. The asdf plugin handles the rename.
"asdf:mise-plugins/mise-scala-cli" = "latest"

# Kotlin compiler (`kotlinc`) for ad-hoc / single-file work and for
# bootstrapping projects. Real Kotlin projects pin the compiler via
# their build tool (Gradle's `kotlin` plugin or Maven's
# `kotlin-maven-plugin`); this global is the standalone CLI.
kotlin = "latest"

# Python project manager. Each distro ships a system `/usr/bin/python3` for
# its own tooling; per-project Pythons go through `uv venv` / `uv python
# install` and live under `~/.local/share/uv/`. Avoids dual-managing the
# system Python alongside a mise-managed one (PEP 668 marks the system
# Python externally-managed on modern distros anyway).
uv = "latest"

# Node tracks whichever LTS line mise's `lts` alias points to. The alias
# is hardcoded in mise's source (src/plugins/core/node.rs), not resolved
# dynamically — jdx/mise bumps it shortly after each October LTS
# cutover, so fresh builds follow with a short lag.
node = "lts"

[settings]
# Corepack shims land after every node install, not just the global one, so a
# project-pinned node gets the pnpm/yarn this stack's README advertises.
node.corepack = true

# Set to true while debugging tool installs.
verbose = false

# Project-local .mise.toml files stay untrusted until an explicit `mise trust`:
# a cloned repo's config is executable (tool installs, env hooks on activation),
# and the per-project prompt is the supply-chain gate this VM exists to keep.
# This global file lives in mise's own default-trusted location.
#
# How wide that gate is depends on the mise release, and mise comes from a
# floating repo at build time. On 2026.6.2 a config holding nothing but a
# `[tools]` pin is refused until trusted (verified in a guest); read
# `mise --version` in the image before relying on that.
