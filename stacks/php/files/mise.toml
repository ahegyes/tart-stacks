# Global tool versions for the php stack (image <distro>-php, e.g. fedora-php).
# Override per-project with a .mise.toml in the project root.

[tools]
# Node tracks whichever LTS line mise's `lts` alias points to. The alias
# is hardcoded in mise's source (src/plugins/core/node.rs), not resolved
# dynamically — jdx/mise bumps it after each October LTS cutover, so
# fresh builds follow with a short lag.
node = "lts"

# Pin PHP to a specific patch. PHP has no LTS concept, so bump explicitly
# when a new stable lands. Fuzzy specs like "8.5" pull RCs (RC strings
# sort higher than the bare patch they precede); run `mise ls-remote php`
# inside the VM to see options before bumping.
#
# The plugin is pinned in [tool_alias] below rather than by naming it here: a
# backend-qualified key ("vfox:jdx/vfox-php" = …) makes THAT string the tool's
# name, so the php it installs satisfies nothing the config asked for — `mise ls`
# reports the entry `(missing)` and the `php` shim has no version to resolve,
# which is what leaves a non-interactive `ssh <vm> php -v` with no PHP at all.
php = "8.5.6"

# Per-project examples (do not enable globally):
# python = "<major.minor>"
# ruby   = "<major.minor>"
# go     = "<major.minor>"

# Which plugin builds php, pinned for the short name so the tool stays `php`.
# Two plugins serve that name and they read PHP_CONFIGURE_OPTIONS with opposite
# meanings — vfox-php treats it as the whole configure line, asdf-php as an
# override of one default group — and mise's registry reorders them between
# releases. Unpinned, `mise tool php` resolves to asdf:php (measured on the mise
# these images ship, 2026.6.2), which compiles a PHP with no pear (hence no
# pecl) and no --with-config-file-scan-dir: every flag mise-install.sh sets is
# written for the vfox contract.
[tool_alias]
php = "vfox:jdx/vfox-php"

[settings]
# Corepack shims are installed after every node install, not just the global
# one — a project-pinned node otherwise lacks the pnpm/yarn the READMEs promise.
node.corepack = true

# Set to true while debugging tool installs (especially PHP, which compiles from source).
verbose = false

# Project-local .mise.toml files stay untrusted until an explicit `mise trust`:
# a cloned repo's config is executable (tool installs, env hooks on activation),
# and the per-project prompt is the supply-chain gate this VM exists to keep.
# This global file lives in mise's own default-trusted location.
