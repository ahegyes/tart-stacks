# Global tool versions for the php stack (image <distro>-php, e.g. fedora-php).
# Override per-project with a .mise.toml in the project root.

[tools]
# Node tracks whichever LTS line mise's `lts` alias points to. The alias
# is hardcoded in mise's source (src/plugins/core/node.rs), not resolved
# dynamically — jdx/mise bumps it after each October LTS cutover, so
# fresh builds follow with a short lag.
node = "lts"

# Pin PHP to a specific patch. PHP has no LTS concept, so bump explicitly
# when a new stable lands. Fuzzy specs like "8.5" pull RCs (RC strings
# sort higher than the bare patch they precede); run `mise ls-remote php`
# inside the VM to see options before bumping.
#
# The tool is named `php`, with the plugin pinned in [tool_alias] below. Naming
# the backend here instead ("vfox:jdx/vfox-php" = …) makes that string the tool's
# name, and with this plugin the php it installs then satisfies no config entry:
# `mise ls` reports `(missing)`, the `php` shim has no version to resolve, and a
# non-interactive `ssh <vm> php -v` finds no PHP at all.
php = "8.5.6"

# Per-project examples (do not enable globally):
# python = "<major.minor>"
# ruby   = "<major.minor>"
# go     = "<major.minor>"

# Which plugin builds php. Two serve that name and read PHP_CONFIGURE_OPTIONS
# with opposite meanings — vfox-php as the whole configure line, asdf-php as an
# override of one default group — and unpinned, `mise tool php` resolves to
# asdf:php, which compiles a PHP with no pear (hence no pecl) and no
# --with-config-file-scan-dir. Every flag mise-install.sh sets is written for the
# vfox contract.
[tool_alias]
php = "vfox:jdx/vfox-php"

[settings]
# Corepack shims land after every node install, not just the global one, so a
# project-pinned node gets pnpm/yarn too.
node.corepack = true

# Set to true while debugging tool installs (especially PHP, which compiles from source).
verbose = false

# Project-local .mise.toml files stay untrusted until an explicit `mise trust`:
# a cloned repo's config is executable (tool installs, env hooks on activation),
# and the per-project prompt is the supply-chain gate this VM exists to keep.
# This global file lives in mise's own default-trusted location.
#
# How wide that gate is depends on the mise release, and mise comes from a
# floating repo at build time. On 2026.6.2 a config holding nothing but a
# `[tools]` pin is refused until trusted (verified in a guest); read
# `mise --version` in the image before relying on that.
