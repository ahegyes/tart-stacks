name: validate

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  discover:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: build the stack matrix from stacks/fedora-*/
        id: set
        shell: bash
        # nullglob → [] on a zero-stack tree; select(length>0) drops the trailing
        # newline split() leaves; jq -R -s -c → valid single-line JSON for fromJSON.
        run: |
          shopt -s nullglob
          printf '%s\n' stacks/fedora-*/ \
            | sed 's|^stacks/||; s|/$||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))' \
            | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  packer:
    name: packer validate (${{ matrix.stack }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    # macOS runner: cirruslabs/tart Packer plugin ships macOS-only binaries.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      # macos-latest preinstalls packer; no setup-packer action needed.
      # Token avoids the 60 req/hr unauthenticated GH API limit packer hits fetching plugin tags.
      - name: packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .
      # packer validate stat()s file provisioner source paths; stub the pubkey so validate passes.
      - name: stub SSH pubkey for validate
        run: mkdir -p ~/.ssh && touch ~/.ssh/tart-vm.pub
      # One parameterized template at the repo root; derive the short token from the fedora-* matrix value.
      - name: packer validate
        env:
          STACK: ${{ matrix.stack }}
        run: packer validate -var stack="${STACK#fedora-}" stack.pkr.hcl

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # SHA-pin; bump tag + refresh SHA together. ignore_names skips zshrc — shellcheck has no shell=zsh.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          ignore_names: zshrc

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: run test suite
        run: ./script/test
