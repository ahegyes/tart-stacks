name: validate

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  discover:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the stack × distro matrix
        id: set
        shell: bash
        run: |
          shopt -s nullglob
          stacks=(); for d in stacks/*/; do stacks+=("$(basename "$d")"); done
          distros=(); while IFS= read -r line; do distros+=("$line"); done \
            < <(grep -vE '^[[:space:]]*(#|$)' shared/distros)
          jq -nc \
            --argjson s "$(printf '%s\n' "${stacks[@]}" | jq -R . | jq -sc .)" \
            --argjson d "$(printf '%s\n' "${distros[@]}" | jq -R . | jq -sc .)" \
            '[$s[] as $stack | $d[] as $distro | {stack:$stack, distro:$distro}]' \
            | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  packer:
    name: packer validate (${{ matrix.distro }}-${{ matrix.stack }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    # macOS runner: cirruslabs/tart Packer plugin ships macOS-only binaries.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # macos-latest preinstalls packer; no setup-packer action needed.
      # Token avoids the 60 req/hr unauthenticated GH API limit packer hits fetching plugin tags.
      - name: packer init
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .
      # packer validate stat()s file provisioner source paths; stub the pubkey so validate passes.
      - name: stub SSH pubkey for validate
        run: mkdir -p ~/.ssh && touch ~/.ssh/tart-vm.pub
      - name: packer validate
        run: packer validate -var stack="${{ matrix.stack }}" -var distro="${{ matrix.distro }}" stack.pkr.hcl

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pin; bump tag + refresh SHA together. ignore_names skips zshrc — shellcheck has no shell=zsh.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          ignore_names: zshrc
      # The .tmpl suffix hides scaffold templates from the action above, so lint what scaffold ships: the token substituted.
      - name: shellcheck scaffold templates
        shell: bash
        run: |
          shopt -s nullglob
          ts=(templates/stack/scripts/*.sh.tmpl)
          [ ${#ts[@]} -gt 0 ] || { echo "no scaffold templates found" >&2; exit 1; }
          for t in "${ts[@]}"; do
            echo "== $t"
            sed 's/__STACK__/x/g' "$t" | shellcheck -
          done

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: run test suite
        run: ./script/test
